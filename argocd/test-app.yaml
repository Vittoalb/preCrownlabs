# Creazione namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ns1

---
apiVersion: v1
kind: Namespace
metadata:
  name: ns2

---
apiVersion: v1
kind: Namespace
metadata:
  name: ns3

---
# Deployment per app1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: ns1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unified
      component: app1
  template:
    metadata:
      labels:
        app: unified
        component: app1
    spec:
      containers:
      - name: app1
        image: nginx:latest
        ports:
        - containerPort: 80

---
# Deployment per app2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: ns2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unified
      component: app2
  template:
    metadata:
      labels:
        app: unified
        component: app2
    spec:
      containers:
      - name: app2
        image: httpd:latest
        ports:
        - containerPort: 80

---
# Deployment per app3
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3
  namespace: ns3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unified
      component: app3
  template:
    metadata:
      labels:
        app: unified
        component: app3
    spec:
      containers:
      - name: app3
        image: httpd:latest
        ports:
        - containerPort: 80

---
# Service app1
apiVersion: v1
kind: Service
metadata:
  name: myservice1
  namespace: ns1
  annotations:
    metallb.universe.tf/address-pool: my-ip-pool
    metallb.universe.tf/allow-shared-ip: "true"
spec:
  ports:
  - name: app1-port
    protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: unified
    component: app1
  type: LoadBalancer

---
# Service app2
apiVersion: v1
kind: Service
metadata:
  name: myservice2
  namespace: ns2
  annotations:
    metallb.universe.tf/address-pool: my-ip-pool
    metallb.universe.tf/allow-shared-ip: "true"
spec:
  ports:
  - name: app2-port
    protocol: TCP
    port: 8080
    targetPort: 80
  selector:
    app: unified
    component: app2
  type: LoadBalancer

---
# Service app3
apiVersion: v1
kind: Service
metadata:
  name: myservice3
  namespace: ns3
  annotations:
    metallb.universe.tf/address-pool: my-ip-pool
    metallb.universe.tf/allow-shared-ip: "true"
spec:
  ports:
  - name: app3-port
    protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: unified
    component: app3
  type: LoadBalancer