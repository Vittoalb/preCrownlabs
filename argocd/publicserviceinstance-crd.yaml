apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: publicserviceinstances.net.super.dev
spec:
  group: net.super.dev
  names:
    kind: PublicServiceInstance
    plural: publicserviceinstances
    singular: publicserviceinstance
    shortNames:
      - psi
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [serviceName, port, targetPort]
              properties:
                serviceName:
                  type: string
                namespace:
                  type: string
                selector:
                  type: object
                  additionalProperties:
                    type: string
                port:
                  type: integer
                targetPort:
                  type: integer
                externalIP:
                  type: string